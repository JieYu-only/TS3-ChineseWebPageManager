name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: Test, lint & build gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Server tests
        run: npm run server:test

      - name: Lint management page
        run: npm run lint --workspace=@ts3-manager/ui

      - name: Build management page
        run: npm run ui:build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Frontend critical-path tests
        run: npm run test:ui:e2e

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build server executable
        run: npm run server:build

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Run production dependency audit
        run: npm audit --omit=dev --json > npm-audit-report.json || true

      - name: Surface audit outcome
        run: |
          cat npm-audit-report.json || echo "(no audit report produced)"
          echo "--------------------------------------------------------------"
          echo "A non-zero npm audit --omit=dev result is a KNOWN / ACCEPTED risk"
          echo "until the Vue 3 / Vuetify 3 migration. Review the report above"
          echo "against docs/security-advisory-assessment.md (tracked in"
          echo "docs/security-tracker.md). Do not treat it as clean until the"
          echo "Vuetify 2 advisories are resolved."

      - name: Reject new High or Critical vulnerabilities
        run: node scripts/verify-audit-baseline.js npm-audit-report.json

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore

  windows-build:
    name: Windows x64 executable build validation
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Build management page
        run: npm run ui:build

      - name: Build Windows executable
        run: npm exec --workspace=@ts3-manager/server -- pkg . --target node22-win-x64

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "packages/server/server.exe")) {
            throw "Expected server.exe was not produced"
          }
          $hash = (Get-FileHash "packages/server/server.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  server.exe" | Set-Content -Encoding ascii "packages/server/server.exe.sha256"
          @(
            "git_sha=${{ github.sha }}"
            "node_version=$(node --version)"
            "npm_version=$(npm --version)"
            "sha256=$hash"
            "size_bytes=$((Get-Item 'packages/server/server.exe').Length)"
          ) | Set-Content -Encoding utf8 "packages/server/server.exe.metadata.txt"
          Write-Host "server.exe produced successfully: SHA256=$hash"

      - name: Upload Windows executable and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ts3-manager-windows-x64-${{ github.sha }}
          path: |
            packages/server/server.exe
            packages/server/server.exe.sha256
            packages/server/server.exe.metadata.txt
          if-no-files-found: error
          retention-days: 14
