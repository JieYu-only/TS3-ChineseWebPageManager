name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server-test:
    name: Server startup & API health check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm run server:test

  ui-build:
    name: Frontend production build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build management page
        run: npm run ui:build

  windows-build:
    name: Windows x64 executable build validation
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build management page
        run: npm run ui:build

      - name: Build Windows executable
        run: npm exec --workspace=@ts3-manager/server -- pkg . --target node22-win-x64

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "packages/server/server.exe")) {
            throw "Expected server.exe was not produced"
          }
          Write-Host "server.exe produced successfully"
