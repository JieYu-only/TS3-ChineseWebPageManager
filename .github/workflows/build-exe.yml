name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: server.exe
            file-name: TS3-ChineseWebPageManager-win-x64-${{ github.event.release.tag_name }}.exe
          - os: ubuntu-latest
            file: server
            file-name: ts3-manager-linux-x64-${{ github.event.release.tag_name }}
          - os: macos-latest
            file: server
            file-name: ts3-manager-macos-x64-${{ github.event.release.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: 16.x
      - run: |
          npm install
          npm run build --if-present

      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: packages/server/${{ matrix.file }}
          asset_name: ${{ matrix.file-name }}
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
