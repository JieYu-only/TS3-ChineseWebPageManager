services:
  ts3-manager:
    build:
      context: .
    image: ts3-manager-custom:latest
    container_name: ts3-manager
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # 服务端“记住登录”加密会话持久化目录
      - ./data:/app/data
    environment:
      PORT: "8080"
      JWT_SECRET: "${JWT_SECRET}"
      SESSION_ENCRYPTION_KEY: "${SESSION_ENCRYPTION_KEY}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      WHITELIST: "${WHITELIST:-}"
